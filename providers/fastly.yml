id: fastly
status: experimental
owner: maintainers
summary: Fastly-backed route coverage for domain and IP classified traffic.
last_tested: 2026-05-31
routes:
  - r130_repack_fastly_h2
  - r150_repack_fastly_ip_h2
  - r220_redirect_fastly_tcp443_h2
  - r320_redirect_fastly_ip_tcp443_h2
geosite_refs:
  - geosite:fastly
  - geosite:reddit
  - geosite:cnn
geoip_refs:
  - geoip:fastly
domain_refs:
  - domain:buzzfeed.com
tested_with:
  os: windows
  client: v2rayN
  xray_min: 26.2.6
  xray: 26.2.6
  environment: lab-windows-v2rayN-desktop
supported_profiles:
  - strict
  - balanced
  - compatibility
  - debug
failure_policy:
  strict: block
  balanced: user_selected_direct_or_report
known_risks:
  - provider_policy_change
  - geosite_drift
  - geoip_drift
  - dns_drift
route_coverage:
  - r130_repack_fastly_h2 handles Fastly-family h2 decrypted domains
  - r150_repack_fastly_ip_h2 handles Fastly geoip h2 decrypted traffic
  - r220_redirect_fastly_tcp443_h2 enters isolated Fastly h2 decrypt path
  - r320_redirect_fastly_ip_tcp443_h2 enters h2 decrypt path for Fastly IPs
test_matrix:
  - route_tag_hit using route diagnostics
  - browser_diagnostics_probe using scripts/browser_smoke.py
  - geosite_geoip_hashes using scripts/geodata_pin.py
maintenance:
  - refresh when Fastly geosite/geoip inputs or provider status changes
  - mark unsupported if provider policy blocks tested flow
failure_modes:
  - provider policy rejection
  - stale geosite or geoip classification
  - DNS qtype drift
rollback:
  - disable fastly-specific redirect routes and keep global catch-all policy
  - record failure in provider status and route-policy evidence
evidence_required:
  - route_tag_hit
  - dns_qtype_check
  - browser_diagnostics_probe

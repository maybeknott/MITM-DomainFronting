id: fastly
status: experimental
last_tested: 2026-05-31
routes:
  - r130_repack_fastly_h2
  - r150_repack_fastly_ip_h2
  - r210_redirect_group_tcp443_h2
  - r320_redirect_fastly_ip_tcp443_h2
geosite_refs:
  - geosite:fastly
  - geosite:reddit
  - geosite:cnn
geoip_refs:
  - geoip:fastly
domain_refs:
  - domain:buzzfeed.com
tested_with:
  os: windows
  client: v2rayN
  xray_min: 26.2.6
  xray: 26.2.6
  environment: lab-windows-v2rayN-desktop
supported_profiles:
  - strict
  - balanced
  - compatibility
  - debug
failure_policy:
  strict: block
  balanced: user_selected_direct_or_report
known_risks:
  - provider_policy_change
  - geosite_drift
  - geoip_drift
  - dns_drift
rollback:
  - disable fastly-specific redirect routes and keep global catch-all policy
  - record failure in provider status and route-policy evidence
evidence_required:
  - route_tag_hit
  - dns_qtype_check
  - browser_diagnostics_probe

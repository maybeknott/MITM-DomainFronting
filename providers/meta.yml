id: meta
status: experimental
owner: maintainers
summary: Meta-family route coverage for h2-targeted flows.
last_tested: 2026-05-31
routes:
  - r140_repack_meta_h2
  - r230_redirect_meta_tcp443_h2
geosite_refs:
  - geosite:meta
geoip_refs: []
domain_refs: []
tested_with:
  os: windows
  client: v2rayN
  xray_min: 26.2.6
  xray: 26.2.6
  environment: lab-windows-v2rayN-desktop
supported_profiles:
  - strict
  - balanced
  - compatibility
  - debug
failure_policy:
  strict: block
  balanced: user_selected_direct_or_report
known_risks:
  - provider_policy_change
  - android_app_trust
  - certificate_pinning
  - quic_udp443
route_coverage:
  - r140_repack_meta_h2 handles Meta-family h2 decrypted domains
  - r230_redirect_meta_tcp443_h2 enters isolated Meta h2 decrypt path
test_matrix:
  - route_tag_hit using route diagnostics
  - browser_diagnostics_probe using scripts/browser_smoke.py
  - Android compatibility noted in docs/platform-compatibility.md
maintenance:
  - refresh when geosite:meta, app trust behavior, or provider policy changes
  - keep Android app limitations explicit in release notes
failure_modes:
  - app certificate pinning
  - provider policy rejection
  - QUIC bypass of TCP decrypt path
rollback:
  - disable meta-specific redirect routes and keep global catch-all policy
  - record failure in provider status and route-policy evidence
evidence_required:
  - route_tag_hit
  - dns_qtype_check
  - browser_diagnostics_probe

id: google
status: experimental
owner: maintainers
summary: Google-family and googlevideo route coverage for h11/h2 paths.
last_tested: 2026-05-31
routes:
  - r100_repack_googlevideo_h11
  - r120_repack_google_h2
  - r200_redirect_googlevideo_tcp443_h11
  - r210_redirect_google_tcp443_h2
geosite_refs:
  - geosite:google
geoip_refs: []
domain_refs:
  - domain:googlevideo.com
tested_with:
  os: windows
  client: v2rayN
  xray_min: 26.2.6
  xray: 26.2.6
  environment: lab-windows-v2rayN-desktop
supported_profiles:
  - strict
  - balanced
  - compatibility
  - debug
failure_policy:
  strict: block
  balanced: user_selected_direct_or_report
known_risks:
  - provider_policy_change
  - geosite_drift
  - dns_drift
  - quic_udp443
route_coverage:
  - r100_repack_googlevideo_h11 handles googlevideo on h11 decrypt path
  - r120_repack_google_h2 handles Google-family h2 decrypt path
  - r200_redirect_googlevideo_tcp443_h11 enters h11 decrypt path
  - r210_redirect_google_tcp443_h2 enters isolated Google h2 decrypt path
test_matrix:
  - route_tag_hit using route diagnostics
  - browser_diagnostics_probe using scripts/browser_smoke.py
  - udp443 policy verification using scripts/protocol_policy_tests.py
maintenance:
  - refresh when geosite:google, googlevideo behavior, QUIC policy, or Xray version changes
  - attach browser smoke output when claiming browser support
failure_modes:
  - provider policy rejection
  - QUIC bypass of TCP decrypt path
  - stale geosite classification
rollback:
  - disable google-specific redirect routes and keep global catch-all policy
  - record failure in provider status and route-policy evidence
evidence_required:
  - route_tag_hit
  - dns_qtype_check
  - browser_diagnostics_probe

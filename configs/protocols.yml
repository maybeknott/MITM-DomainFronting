version: 1
last_updated: "2026-05-31"

protocols:
  tcp_443_https:
    status: supported
    required_tests:
      - route_tag_match
      - certificate_trust
      - provider_route

  http_1_1_tls:
    status: supported
    edge_cases:
      - websocket_upgrade
      - keepalive
      - redirects

  http_2_tls:
    status: supported
    edge_cases:
      - grpc
      - multiplexing
      - stream_reset

  http_3_quic_udp_443:
    status: profile_defined
    expected_behavior: strict_debug_block_balanced_compatibility_direct
    tests:
      - udp_443_route
      - browser_http3_enabled_disabled

  dns_udp_tcp_53:
    status: supported
    tests:
      - resolver_timeout
      - private_domain
      - nxdomain

  doh:
    status: resolver_dependent
    tests:
      - resolver_tls_path
      - fallback

  dot:
    status: not_explicitly_supported_unless_configured

  doq:
    status: not_explicitly_supported_unless_configured

  websocket:
    status: test_required
    smoke_command: python scripts/protocol_smoke.py --scenario websocket-handshake
    depends_on:
      - http_1_1_tls

  grpc:
    status: test_required
    smoke_command: python scripts/protocol_smoke.py --scenario grpc-alpn
    depends_on:
      - http_2_tls

  webrtc_stun_turn:
    status: degraded_or_unknown
    reason: udp_heavy_app_browser_specific

  ipv6:
    status: test_required
    smoke_command: python scripts/protocol_smoke.py --scenario ipv6-connect

  nat64_dns64:
    status: test_required
    smoke_command: python scripts/dns_lab_harness.py --scenario nat64-dns64

  private_lan:
    status: direct_expected

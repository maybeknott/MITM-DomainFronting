name: Build GUI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Download bundled Xray Core
        run: python scripts/install_xray.py --out-dir xray --force

      - name: Run GUI build script
        run: python scripts/build_gui_exe.py --skip-install

      - name: Package final Windows app bundle
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "dev" }
          $zip = "dist/MITM-DomainFronting-Control-Center-$tag-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/MITM-DomainFronting-Control-Center" -DestinationPath $zip -CompressionLevel Optimal
          $hash = Get-FileHash -Algorithm SHA256 $zip
          "$($hash.Hash)  $(Split-Path $zip -Leaf)" | Set-Content -Encoding ascii "$zip.sha256"
          Get-ChildItem dist -Filter "MITM-DomainFronting-Control-Center-*.zip*" | Format-Table -AutoSize

      - name: Upload GUI build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist
          path: |
            dist/MITM-DomainFronting-Control-Center/**
            dist/MITM-DomainFronting-Control-Center-*.zip
            dist/MITM-DomainFronting-Control-Center-*.zip.sha256
          if-no-files-found: error

      - name: Publish GUI build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MITM-DomainFronting ${{ github.ref_name }}
          body: |
            Download the Windows app bundle asset below.

            GitHub also shows automatic source-code archives for every tag; those are not the final product package.
          files: |
            dist/MITM-DomainFronting-Control-Center-${{ github.ref_name }}-windows-x64.zip
            dist/MITM-DomainFronting-Control-Center-${{ github.ref_name }}-windows-x64.zip.sha256
          fail_on_unmatched_files: true

name: Build GUI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Run GUI build script
        run: python scripts/build_gui_exe.py --skip-install

      - name: Upload GUI build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist
          path: dist/MITM-DomainFronting-Control-Center/**
          if-no-files-found: error

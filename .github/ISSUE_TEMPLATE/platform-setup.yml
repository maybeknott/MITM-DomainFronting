name: Platform setup help
description: Setup issue for Windows, Android, macOS, or Linux
labels: [setup]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload `mycert.key`. For certificate issues, share only the first 12 characters of the certificate SHA-256 fingerprint.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client/version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser/app/version
    validations:
      required: true
  - type: dropdown
    id: ech_state
    attributes:
      label: ECH state (if known)
      options:
        - enabled
        - disabled
        - unknown
    validations:
      required: true
  - type: dropdown
    id: capture_mode
    attributes:
      label: Capture mode
      options:
        - Browser/system proxy
        - Android VPN-service/TUN
        - Desktop full-system TUN
        - Desktop split tunnel
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: completed
    attributes:
      label: Completed steps
      options:
        - label: Generated local `mycert.crt` and `mycert.key`
        - label: Installed `mycert.crt` into OS/browser trust store
        - label: Verified certificate fingerprint
        - label: Imported Xray config
        - label: Confirmed ports 10808, 11666, 11777 are not occupied by another program
        - label: Ran preflight script
        - label: Checked captive portal warning from preflight (if on public Wi-Fi)
        - label: Checked proxy/VPN/TUN conflict warnings
        - label: Confirmed whether this is browser-only or independent-app behavior
  - type: dropdown
    id: captive_portal
    attributes:
      label: Captive portal state
      options:
        - not applicable
        - completed login / no portal
        - portal likely / not yet logged in
        - unknown
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What failed?
    validations:
      required: true
